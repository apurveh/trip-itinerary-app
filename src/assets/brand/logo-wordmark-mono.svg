<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="logo-mono-title logo-mono-desc">
  <title id="logo-mono-title">The Clara &amp; Apurva Files (mono)</title>
  <desc id="logo-mono-desc">Single-color wordmark using currentColor — inherits whatever color you set on the parent.</desc>

  <text x="300" y="40" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" letter-spacing="6" fill="currentColor">— A DOSSIER —</text>

  <text x="300" y="100" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="48" fill="currentColor">The Clara &amp; Apurva</text>

  <g transform="translate(210, 124)">
    <rect x="0" y="0" width="180" height="40" fill="currentColor"/>
    <text x="90" y="29" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-weight="700" font-style="italic"
          font-size="26" letter-spacing="7" fill="#FAEEDA">FILES</text>
  </g>

  <g transform="translate(300, 195)" stroke="currentColor" fill="currentColor">
    <line x1="-200" y1="0" x2="-50" y2="0" stroke-width="0.8"/>
    <text x="0" y="4" text-anchor="middle" stroke="none"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="10" letter-spacing="4">TWO TRAVELERS · ONE DOSSIER</text>
    <line x1="50" y1="0" x2="200" y2="0" stroke-width="0.8"/>
  </g>
</svg>
